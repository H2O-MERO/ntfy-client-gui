[package]
name = "ntfy-client-gui"
version = "0.1.0"
edition = "2021"
description = "ntfy.sh desktop client built with Rust and egui"
license = "MIT"
authors = ["ntfy-client-gui contributors"]
repository = "https://github.com/H2O-MERO/ntfy-client-gui"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
base64 = "0.22"
http = "1"
semver = "1"
webbrowser = "1"
rfd = "0.15"
notify-rust = "4"
tray-icon = "0.19"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 2
lto = "thin"
strip = "symbols"
